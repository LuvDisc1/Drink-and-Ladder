<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipsy Ladders</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#120f1c;--panel:#1d182b;--panel2:#272039;--text:#f8f5ff;
    --muted:#aaa1bc;--accent:#ff4f81;--accent2:#7c5cff;--green:#47d7a5;
  }
  body{
    margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
    background:radial-gradient(circle at 20% 0%,#34204b 0,#120f1c 42%,#0c0a12 100%);
    color:var(--text);min-height:100vh;
  }
  .wrap{max-width:1200px;margin:auto;padding:22px}
  header{text-align:center;margin:10px 0 22px}
  h1{font-size:clamp(2rem,5vw,4rem);margin:0;font-weight:900;letter-spacing:-2px}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);margin:8px 0}
  .layout{display:grid;grid-template-columns:minmax(320px,1fr) 350px;gap:20px;align-items:start}
  .panel{background:rgba(29,24,43,.88);border:1px solid #3b3150;border-radius:22px;box-shadow:0 20px 60px #0005}
  .board-panel{padding:18px}
  #board{
    width:min(78vw,720px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);
    border-radius:16px;overflow:hidden;border:4px solid #45385b;background:#302740;
  }
  .cell{
    position:relative;display:flex;align-items:flex-start;justify-content:flex-start;
    padding:6px;font-weight:900;font-size:clamp(9px,1.25vw,15px);min-width:0;
    border:1px solid #ffffff10;
  }
  .cell:nth-child(odd){background:#332a42}.cell:nth-child(even){background:#2b2439}
  .cell.special{background:#3b2e48}
  .num{opacity:.65}
  .task{position:absolute;inset:auto 3px 3px;font-size:clamp(6px,.85vw,10px);line-height:1.05;text-align:center;color:#e9e2f4}
  .ladder,.snake{position:absolute;z-index:1;pointer-events:none;font-size:clamp(15px,2.2vw,30px);filter:drop-shadow(0 3px 2px #0008)}
  .ladder{color:#47d7a5}.snake{color:#ff557f}
  .piece{
    position:absolute;right:4px;top:4px;width:clamp(20px,3vw,31px);height:clamp(20px,3vw,31px);
    border-radius:50%;display:grid;place-items:center;color:white;font-size:11px;border:2px solid #fff;
    box-shadow:0 3px 8px #0008;z-index:5;
  }
  .p1{background:#ff4f81}.p2{background:#7c5cff}.p3{background:#f6b73c}.p4{background:#35c9e8}
  .controls{padding:20px}
  .turn{background:#15121f;border-radius:16px;padding:15px;text-align:center;margin-bottom:15px}
  .turn small{color:var(--muted)}.turn strong{display:block;font-size:1.4rem;margin-top:3px}
  .dice{font-size:4rem;text-align:center;line-height:1;margin:8px 0 16px}
  button{
    width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:900;font-size:1rem;
    cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7a4f);
    box-shadow:0 8px 22px #ff4f8130;transition:.15s transform,.15s opacity;
  }
  button:hover{transform:translateY(-2px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .secondary{background:#342b46;box-shadow:none;margin-top:9px}
  .players{display:grid;gap:9px;margin:16px 0}
  .player{
    display:flex;justify-content:space-between;align-items:center;background:#282139;
    border:1px solid #3d3450;border-radius:12px;padding:10px 12px
  }
  .player.active{border-color:var(--accent);box-shadow:0 0 0 2px #ff4f8130}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
  .score{color:#d7cfe5;font-size:.9rem}
  .log{max-height:220px;overflow:auto;margin-top:14px;padding-right:4px}
  .log div{padding:9px 10px;border-bottom:1px solid #ffffff0d;color:#cfc7dc;font-size:.9rem}
  .modal{
    position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20
  }
  .modal.show{display:grid}.card{max-width:520px;width:100%;background:#201a2f;border:1px solid #4b3d61;border-radius:24px;padding:25px;text-align:center}
  .card h2{margin:0 0 10px}.challenge{font-size:1.35rem;font-weight:800;margin:22px 0;line-height:1.35}
  .safe{font-size:.8rem;color:var(--muted);margin-top:12px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.controls{max-width:720px;margin:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Tipsy <span>Ladders</span> 🍻</h1>
  <p>Roll. Climb. Slide. Survive the board.</p>
</header>

<div class="layout">
  <section class="panel board-panel"><div id="board"></div></section>

  <aside class="panel controls">
    <div class="turn"><small>Current turn</small><strong id="turnName">Player 1</strong></div>
    <div class="dice" id="dice">🎲</div>
    <button id="roll">ROLL THE DICE</button>
    <button class="secondary" id="newGame">NEW GAME</button>
    <div class="players" id="players"></div>
    <div class="log" id="log"></div>
    <div class="safe">Drink responsibly. You can replace every drink challenge with water, soda, or a no-drink challenge.</div>
  </aside>
</div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2 id="modalTitle">Challenge!</h2>
    <div class="challenge" id="challenge"></div>
    <button id="done">DONE</button>
  </div>
</div>

<script>
const challenges=[
  "Take 1 sip.",
  "Give 2 sips to another player.",
  "Everyone takes 1 sip.",
  "Tell a funny story or take 2 sips.",
  "Truth or sip.",
  "Pick someone: they take 1 sip.",
  "No talking until your next turn.",
  "Compliment the player on your left.",
  "Everyone with a phone in their hand takes 1 sip.",
  "Make a toast in the most dramatic voice possible.",
  "Take 2 sips, or do 5 jumping jacks.",
  "Choose a player to swap places with you.",
  "Last person to touch the table takes 1 sip.",
  "Name 3 things in 5 seconds or take 1 sip.",
  "Everyone votes: funniest player takes 1 sip.",
  "Skip your next drink challenge."
];

const ladders={4:14,9:31,20:38,28:84,40:59,51:67,63:81,71:91};
const snakes={17:7,54:34,62:19,64:60,87:24,93:73,95:75,99:78};
let players=[
  {name:"Player 1",pos:1,cls:"p1"},
  {name:"Player 2",pos:1,cls:"p2"}
];
let current=0, rolling=false;

const board=document.getElementById("board"), playersEl=document.getElementById("players");
const turnName=document.getElementById("turnName"), dice=document.getElementById("dice");
const log=document.getElementById("log"), modal=document.getElementById("modal");
const challenge=document.getElementById("challenge"), modalTitle=document.getElementById("modalTitle");

function cellNumber(i){
  const row=Math.floor((i)/10), col=i%10;
  return row%2===0 ? row*10+col+1 : row*10+(10-col);
}
function renderBoard(){
  board.innerHTML="";
  for(let i=0;i<100;i++){
    const n=cellNumber(i), c=document.createElement("div");
    c.className="cell"+((ladders[n]||snakes[n])?" special":"");
    c.dataset.n=n;
    c.innerHTML=`<span class="num">${n}</span>`;
    if(ladders[n]) c.innerHTML+=`<span class="ladder">🪜</span>`;
    if(snakes[n]) c.innerHTML+=`<span class="snake">🐍</span>`;
    board.appendChild(c);
  }
  renderPieces();
}
function renderPieces(){
  document.querySelectorAll(".piece").forEach(x=>x.remove());
  players.forEach((p,i)=>{
    const cell=document.querySelector(`.cell[data-n="${p.pos}"]`);
    if(!cell)return;
    const el=document.createElement("div");
    el.className=`piece ${p.cls}`;el.textContent=i+1;cell.appendChild(el);
  });
}
function renderPlayers(){
  playersEl.innerHTML=players.map((p,i)=>`
    <div class="player ${i===current?"active":""}">
      <span><i class="dot ${p.cls}"></i>${p.name}</span>
      <span class="score">Tile ${p.pos}</span>
    </div>`).join("");
  turnName.textContent=players[current].name;
}
function addLog(text){
  const d=document.createElement("div");d.textContent=text;
  log.prepend(d);
}
function showChallenge(title,text){
  modalTitle.textContent=title;challenge.textContent=text;modal.classList.add("show");
}
function nextTurn(){current=(current+1)%players.length;renderPlayers();}
async function movePlayer(p,steps){
  for(let i=0;i<steps;i++){
    if(p.pos<100)p.pos++;
    renderBoard();renderPlayers();
    await new Promise(r=>setTimeout(r,90));
  }
  if(ladders[p.pos]){
    const from=p.pos;p.pos=ladders[from];renderBoard();
    addLog(`${p.name} climbed from ${from} to ${p.pos} 🪜`);
    showChallenge("LADDER! 🪜",challenges[Math.floor(Math.random()*challenges.length)]);
  } else if(snakes[p.pos]){
    const from=p.pos;p.pos=snakes[from];renderBoard();
    addLog(`${p.name} slid from ${from} to ${p.pos} 🐍`);
    showChallenge("SNAKE! 🐍","Take 2 sips — or choose a harmless penalty instead.");
  } else {
    showChallenge(`Tile ${p.pos}`,challenges[Math.floor(Math.random()*challenges.length)]);
  }
}
document.getElementById("roll").onclick=async()=>{
  if(rolling)return;rolling=true;
  const p=players[current], roll=Math.floor(Math.random()*6)+1;
  dice.textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][roll-1];
  addLog(`${p.name} rolled ${roll}.`);
  if(p.pos+roll<=100) await movePlayer(p,roll);
  else showChallenge("Almost there!","You need an exact roll to reach tile 100.");
  if(p.pos===100){
    showChallenge("🏆 WINNER!",`${p.name} reached tile 100! Everyone else owes them a victory toast.`);
    document.getElementById("roll").disabled=true;
  } else nextTurn();
  rolling=false;
};
document.getElementById("done").onclick=()=>modal.classList.remove("show");
document.getElementById("newGame").onclick=()=>{
  players.forEach(p=>p.pos=1);current=0;log.innerHTML="";dice.textContent="🎲";
  document.getElementById("roll").disabled=false;renderBoard();renderPlayers();
};
renderBoard();renderPlayers();
</script>
</body>
</html>
